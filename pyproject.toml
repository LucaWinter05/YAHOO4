[project]
name = "yahoo"
version = "0.2.0"
description = "OTTO Aktien-Matcher – übersetzt Börsenkurse in echte Produkte"
requires-python = ">=3.12"
dependencies = [
    "altair>=5.4",
    "beautifulsoup4>=4.15.0",
    "currencyconverter>=0.18.10",
    "pandas>=3.0.5",
    "pandas-stubs~=3.0.5",
    "requests>=2.34.2",
    "streamlit>=1.64.0",
    "streamlit-searchbox>=0.1.24",
    "yfinance>=1.7.0",
    "st-copy>=0.1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
